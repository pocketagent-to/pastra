<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pastra — Toasts</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600&display=swap"><style>body{margin:0;background:#000}a{color:#FFFFFF}a:hover{color:#FF6B2C}</style></head><body>
<div style="width:390px;height:854px;box-sizing:border-box;padding:28px 20px;background:radial-gradient(130% 55% at 50% 0%,#10217A 0%,#05081F 45%,#000000 75%);color:#FFFFFF;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;gap:14px">
  <div style="font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.05em;padding-bottom:4px">DONE</div>
  <div role="status" style="min-height:52px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#1E9E57;color:#04130A;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4 4 8-9"></path></svg>Promo code copied</div>
  <div role="status" style="min-height:52px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#1E9E57;color:#04130A;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4 4 8-9"></path></svg>Link copied</div>
  <div role="status" style="min-height:52px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#1E9E57;color:#04130A;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4 4 8-9"></path></svg>Image saved</div>
  <div role="status" style="min-height:52px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#1E9E57;color:#04130A;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4 4 8-9"></path></svg>FACEIT connected. Gaming +4</div>

  <div style="font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.05em;padding:14px 0 4px">INFO</div>
  <div role="status" style="min-height:52px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#16171B;border:1px solid #2A2C34;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600">Steam disconnected. Its data was deleted</div>
  <div role="status" style="min-height:52px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#16171B;border:1px solid #2A2C34;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600">Reminder sent to sam</div>
  <div role="status" style="min-height:52px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#16171B;border:1px solid #2A2C34;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600">You're offline. Showing saved data</div>

  <div style="font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.05em;padding:14px 0 4px">PROBLEM</div>
  <div role="alert" style="min-height:52px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#FF6B2C;color:#0A0A0A;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600">Couldn't connect FACEIT<button type="button" style="height:44px;padding:0 12px;border-radius:10px;border:1.5px solid #0A0A0A;background:transparent;color:#0A0A0A;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">Retry</button></div>
  <div role="alert" style="min-height:52px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#FF6B2C;color:#0A0A0A;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600">This offer has expired</div>
  <div role="alert" style="min-height:52px;box-sizing:border-box;padding:12px 16px;border-radius:16px;background:#FF6B2C;color:#0A0A0A;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600">You cancelled the sign-in. Nothing was connected</div>
</div>
</body></html>
