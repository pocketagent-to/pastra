<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pastra — Log in</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600&display=swap"><style>body{margin:0;background:#000}a{color:#FFFFFF}a:hover{color:#FF6B2C}</style></head><body>
<div style="width:390px;height:844px;box-sizing:border-box;background:radial-gradient(130% 55% at 50% 0%,#10217A 0%,#05081F 45%,#000000 75%);color:#FFFFFF;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;padding:14px 20px;background:#16171B;min-height:44px">
    <div style="display:flex;align-items:center;gap:10px"><svg viewBox="0 0 120 120" width="34" height="34" aria-hidden="true"><rect width="120" height="120" rx="30" fill="#1F4BFF"></rect><g transform="translate(60 60) scale(0.74) translate(-60 -60)"><polygon points="60,10 103.3,35 103.3,85 60,110 16.7,85 16.7,35" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round"></polygon><polygon points="60,46.7 91.3,41.9 88,76.2 60,79 40.3,71.4 50.1,54.3" fill="#FF6B2C" stroke="#FF6B2C" stroke-width="3" stroke-linejoin="round"></polygon></g></svg><div style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:18px;letter-spacing:0.04em">PASTRA</div></div>
  </div>
  <div style="padding:32px 20px 24px;display:flex;flex-direction:column;gap:24px;flex-grow:1">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:28px;text-transform:uppercase;line-height:1.15">Welcome back</div>
      <div style="font-size:15px;color:#C7CBD6">Use Google or the email you signed up with.</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <a href="Main.html" style="height:54px;border-radius:16px;background:#FFFFFF;color:#0A0A0A;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px;font-weight:600">Continue with Google</a>
    </div>
    <div style="display:flex;align-items:center;gap:12px;color:#A3A8B3;font-size:13px"><div style="flex-grow:1;height:1px;background:#2A2C34"></div>or<div style="flex-grow:1;height:1px;background:#2A2C34"></div></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <label for="login-email" style="font-size:13px;font-weight:600;color:#C7CBD6">Email</label>
      <input id="login-email" type="email" placeholder="you@example.com" style="height:54px;box-sizing:border-box;padding:0 16px;border-radius:16px;border:1.5px solid #4A4E5A;background:#16171B;color:#FFFFFF;font-family:inherit;font-size:15px">
      <a href="CheckEmail.html" style="height:56px;border-radius:16px;background:#FF6B2C;color:#0A0A0A;display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.03em;text-transform:uppercase">Send me a login link</a>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:4px;align-items:center">
      <a href="Recover.html" style="min-height:44px;display:flex;align-items:center;font-size:14px;color:#C7CBD6">Can't get into your email or Google?</a>
      <a href="SignUp.html" style="min-height:44px;display:flex;align-items:center;font-size:14px;color:#C7CBD6">New here? Build a pass</a>
    </div>
  </div>
</div>
</body></html>
