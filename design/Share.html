<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pastra — Share</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600&display=swap"><style>body{margin:0;background:#000}a{color:#FFFFFF}a:hover{color:#FF6B2C}</style></head><body>
<div style="width: 390px; height: 848px; box-sizing: border-box; background: radial-gradient(130% 55% at 50% 0%, #10217A 0%, #05081F 45%, #000000 75%); color: #FFFFFF; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 14px; padding: 14px 20px; background: #16171B">
    <a href="Main.html" aria-label="Back to pass" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <div style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.04em">SHARE</div>
  </div>

  <div style="padding: 24px 20px 24px; display: flex; flex-direction: column; gap: 22px; flex-grow: 1">
    <div style="border-radius: 20px; border: 1px solid #2A2C34; background: #000000; padding: 16px; display: flex; gap: 12px; align-items: center">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 6px"><svg viewBox="0 0 120 120" width="18" height="18" aria-hidden="true"><rect width="120" height="120" rx="30" fill="#1F4BFF"></rect><g transform="translate(60 60) scale(0.74) translate(-60 -60)"><polygon points="60,10 103.3,35 103.3,85 60,110 16.7,85 16.7,35" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round"></polygon><polygon points="60,46.7 91.3,41.9 88,76.2 60,79 40.3,71.4 50.1,54.3" fill="#FF6B2C"></polygon></g></svg><div style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 9px; letter-spacing: 0.06em">PASTRA</div></div>
        <div style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 24px; text-transform: uppercase; line-height: 1">nomad</div>
        <div style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 9px; text-transform: uppercase; color: #FF8A57">Gamer &amp; crypto veteran</div>
        <div style="display: flex; gap: 12px; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 12px; color: #FF6B2C"><span>2,140 h</span><span>7 yrs</span><span>LVL 27</span></div>
      </div>
      <svg viewBox="-110 -110 220 220" width="124" height="124" aria-hidden="true">
        <polygon points="0,-105 90.9,-52.5 90.9,52.5 0,105 -90.9,52.5 -90.9,-52.5" fill="none" stroke="#3A3D47" stroke-width="2"></polygon>
        <polygon points="0,-35.7 85.5,-49.4 80,46.2 0,54.6 -55.5,32 -24.6,-14.2" fill="#1F4BFF" fill-opacity="0.4" stroke="#5B82FF" stroke-width="4" stroke-linejoin="round"></polygon>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.05em">FORMAT</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="true" style="height: 48px; border-radius: 14px; border: none; background: #1F4BFF; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">X post</button>
        <button type="button" aria-pressed="false" style="height: 48px; border-radius: 14px; border: 1.5px solid #FFFFFF; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Story</button>
        <button type="button" aria-pressed="false" style="height: 48px; border-radius: 14px; border: 1.5px solid #FFFFFF; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Square</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.05em">WHAT TO SHOW</div>
      <div style="background: #16171B; border-radius: 24px; padding: 4px 16px; display: flex; flex-direction: column">
        <label style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; cursor: pointer">Hexagon<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1F4BFF"></label>
        <label style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; border-top: 1px solid #2A2C34; cursor: pointer">Level and title<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1F4BFF"></label>
        <label style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; border-top: 1px solid #2A2C34; cursor: pointer">Top numbers<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #1F4BFF"></label>
        <label style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; border-top: 1px solid #2A2C34; cursor: pointer">Stamps<input type="checkbox" style="width: 22px; height: 22px; accent-color: #1F4BFF"></label>
        <label style="min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; border-top: 1px solid #2A2C34; cursor: pointer"><span style="display: flex; flex-direction: column; gap: 2px">Sports side<span style="font-size: 12px; color: #A3A8B3">Health data is hidden by default</span></span><input type="checkbox" style="width: 22px; height: 22px; accent-color: #1F4BFF"></label>
      </div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <a href="ShareDone.html" style="height: 56px; border-radius: 16px; background: #FF6B2C; color: #0A0A0A; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.03em; text-transform: uppercase">Post to X</a>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" style="height: 52px; border-radius: 16px; border: 1.5px solid #FFFFFF; background: transparent; color: #FFFFFF; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 12px; text-transform: uppercase; cursor: pointer">Copy link</button>
        <button type="button" style="height: 52px; border-radius: 16px; border: 1.5px solid #FFFFFF; background: transparent; color: #FFFFFF; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 12px; text-transform: uppercase; cursor: pointer">Save image</button>
      </div>
    </div>
  </div>
</div>
</body></html>
