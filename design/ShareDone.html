<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pastra — Shared</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600&display=swap"><style>body{margin:0;background:#000}a{color:#FFFFFF}a:hover{color:#FF6B2C}</style></head><body>
<div style="width:390px;height:844px;box-sizing:border-box;background:radial-gradient(130% 55% at 50% 0%,#10217A 0%,#05081F 45%,#000000 75%);color:#FFFFFF;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:14px;padding:14px 20px;background:#16171B">
    <a href="Main.html" aria-label="Back to pass" style="width:44px;height:44px;box-sizing:border-box;border-radius:12px;border:1.5px solid #FFFFFF;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <div style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:16px;letter-spacing:0.04em">SHARED</div>
  </div>

  <div style="padding:28px 20px 24px;display:flex;flex-direction:column;gap:22px;flex-grow:1">
    <div style="display:flex;flex-direction:column;gap:12px;align-items:flex-start">
      <div style="padding:8px 14px;border-radius:12px;background:#1E9E57;box-shadow:0 0 18px rgba(46,204,113,0.45);color:#04130A;font-family:'Unbounded',sans-serif;font-weight:700;font-size:11px;letter-spacing:0.05em">POSTED TO X</div>
      <div style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:26px;text-transform:uppercase;line-height:1.15">Your pass is out there</div>
      <div style="font-size:15px;color:#C7CBD6;line-height:1.5">Anyone who opens your link sees only what you chose to show.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.05em">YOUR LINK</div>
      <div style="height:52px;box-sizing:border-box;padding:0 16px;border-radius:16px;background:#16171B;display:flex;align-items:center;font-size:15px">[your-domain]/nomad</div>
      <button type="button" style="height:52px;border-radius:16px;border:1.5px solid #FFFFFF;background:transparent;color:#FFFFFF;font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer">Copy link</button>
    </div>

    <div style="background:#0B1238;border:1px solid #1F2C6B;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;line-height:1.3">Dare a friend to compare</div>
      <div style="font-size:14px;color:#C7CBD6;line-height:1.45">You both get +5 points when they build a pass.</div>
      <a href="Friends.html" style="height:52px;border-radius:16px;background:#FF6B2C;color:#0A0A0A;display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.03em;text-transform:uppercase">Invite friends</a>
    </div>

    <a href="Main.html" style="margin-top:auto;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#C7CBD6">Back to my pass</a>
  </div>
</div>
</body></html>
