<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pastra — Delete account</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600&display=swap"><style>body{margin:0;background:#000}a{color:#FFFFFF}a:hover{color:#FF6B2C}</style></head><body>
<div style="width:390px;height:844px;box-sizing:border-box;background:radial-gradient(130% 55% at 50% 0%,#10217A 0%,#05081F 45%,#000000 75%);color:#FFFFFF;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;gap:14px;padding:14px 20px;background:#16171B">
    <a href="Settings.html" aria-label="Back to settings" style="width:44px;height:44px;box-sizing:border-box;border-radius:12px;border:1.5px solid #FFFFFF;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <div style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:16px;letter-spacing:0.04em">DELETE ACCOUNT</div>
  </div>

  <div style="padding:24px 20px;display:flex;flex-direction:column;gap:22px;flex-grow:1">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.2">Delete everything?</div>
      <div style="font-size:15px;color:#C7CBD6;line-height:1.5">This removes your account and cannot be undone.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.05em">WHAT GETS DELETED</div>
      <div style="background:#16171B;border-radius:24px;padding:4px 16px;display:flex;flex-direction:column">
        <div style="min-height:48px;display:flex;align-items:center;font-size:14px">Your pass, level and stamps</div>
        <div style="min-height:48px;display:flex;align-items:center;font-size:14px;border-top:1px solid #2A2C34">All data from connected services</div>
        <div style="min-height:48px;display:flex;align-items:center;font-size:14px;border-top:1px solid #2A2C34">Your public pass page and share links</div>
        <div style="min-height:48px;display:flex;align-items:center;font-size:14px;border-top:1px solid #2A2C34">Your card, once you have closed it</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <label for="delete-confirm" style="font-size:13px;font-weight:600;color:#C7CBD6">Type DELETE to confirm</label>
      <input id="delete-confirm" type="text" placeholder="DELETE" style="height:54px;box-sizing:border-box;padding:0 16px;border-radius:16px;border:1.5px solid #4A4E5A;background:#16171B;color:#FFFFFF;font-family:inherit;font-size:15px">
    </div>

    <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
      <a href="Landing.html" style="height:56px;border-radius:16px;border:1.5px solid #FF8A7A;color:#FF8A7A;display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.03em;text-transform:uppercase">Delete my account</a>
      <a href="Settings.html" style="height:56px;border-radius:16px;background:#1F4BFF;color:#FFFFFF;display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:'Unbounded',sans-serif;font-weight:700;font-size:14px;letter-spacing:0.03em;text-transform:uppercase">Keep my account</a>
    </div>
  </div>
</div>
</body></html>
