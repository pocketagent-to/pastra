# Local development database (see docs/architecture.md section 15).
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: pastra-postgres
    environment:
      POSTGRES_USER: pastra
      POSTGRES_PASSWORD: pastra
      POSTGRES_DB: pastra
    ports:
      - '5432:5432'
    volumes:
      - pastra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pastra -d pastra']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pastra-pgdata:
